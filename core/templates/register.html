{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" data-aos="fade-up">
        <div class="auth-header">
            <i class="mdi mdi-account-plus auth-icon"></i>
            <h2>Create Account</h2>
            <p>Join our community for mental wellness</p>
        </div>
        
        <form method="post" class="auth-form needs-validation">
            {% csrf_token %}
            <div class="form-floating mb-3">
                {{ form.username }}
                <label for="{{ form.username.id_for_label }}">Username</label>
            </div>
            <div class="form-floating mb-3">
                {{ form.email }}
                <label for="{{ form.email.id_for_label }}">Email address</label>
            </div>
            <div class="form-floating mb-3">
                {{ form.password1 }}
                <label for="{{ form.password1.id_for_label }}">Password</label>
            </div>
            <div class="form-floating mb-4">
                {{ form.password2 }}
                <label for="{{ form.password2.id_for_label }}">Confirm Password</label>
            </div>
            
            <button type="submit" class="btn btn-gradient w-100">
                <i class="mdi mdi-account-plus me-2"></i>Create Account
            </button>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="{% url 'login' %}">Sign In</a></p>
            </div>
        </form>
    </div>
</div>

<style>
    .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }

    .auth-card {
        background: #fff;
        padding: 3rem;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-icon {
        font-size: 3rem;
        color: var(--primary-color);
        margin-bottom: 1rem;
    }

    .auth-header h2 {
        color: var(--text-color);
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    .auth-header p {
        color: var(--text-color);
        opacity: 0.7;
    }

    .auth-form input {
        border: 2px solid rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        padding: 1rem;
        transition: all 0.3s ease;
    }

    .auth-form input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.25);
    }

    .btn-gradient {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: #fff;
        border: none;
        padding: 1rem;
        border-radius: 10px;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        color: #fff;
    }

    .auth-footer {
        text-align: center;
        margin-top: 2rem;
    }

    .auth-footer a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .auth-footer a:hover {
        color: var(--secondary-color);
    }

    /* Form Floating Styles */
    .form-floating > label {
        padding: 1rem;
    }

    .form-floating > .form-control {
        height: calc(3.5rem + 2px);
        line-height: 1.25;
    }

    /* Form Validation Styles */
    .form-control.is-invalid {
        border-color: #dc3545;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' width='12' height='12' fill='none' stroke='%23dc3545'%3e%3ccircle cx='6' cy='6' r='4.5'/%3e%3cpath stroke-linejoin='round' d='M5.8 3.6h.4L6 6.5z'/%3e%3ccircle cx='6' cy='8.2' r='.6' fill='%23dc3545' stroke='none'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right calc(0.375em + 0.1875rem) center;
        background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
    }

    .invalid-feedback {
        color: #dc3545;
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }
</style>

<script>
    // Form validation
    document.querySelector('.needs-validation').addEventListener('submit', function(event) {
        if (!this.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        }
        this.classList.add('was-validated');
    });
</script>
{% endblock %}
